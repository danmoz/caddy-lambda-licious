name: Bump release tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Bump release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Run this workflow from master to create a release tag."
          exit 1

      - name: Bump and push semver tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ github.token }}
          force_bump: ${{ inputs.bump }}
          release_branches: master
          default_bump: false
          create_annotated_tag: true
